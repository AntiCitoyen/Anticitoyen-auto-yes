name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect lintian

      - name: Tests (pseudo-terminal)
        run: python3 -m unittest discover -s tests -v

      - name: Debian package
        run: |
          packaging/build-deb.sh
          lintian --fail-on error dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
