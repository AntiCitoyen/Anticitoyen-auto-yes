# auto-yes : un motif expect (regexp Tcl, -re) par ligne, sans le "-re" ni les guillemets.
# Ligne vide ou commençant par # ignorée. Relu à chaque nouveau terminal : modifier ce
# fichier ne demande pas de réinstaller le paquet.
#
# Motif par défaut : la question « Do you want to proceed? » suivie, sur la ligne d'après,
# du choix « 1. » (menu de confirmation numéroté). La phrase seule (affichée par cat, echo,
# un journal…) ne déclenche rien. En Tcl, \b est un retour arrière : utiliser \s ou \y.
(?i)do you want to proceed\??[^\n]*\n\s*1\.
